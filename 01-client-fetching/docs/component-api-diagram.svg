  <text x="630" y="467" text-anchor="middle" font-size="13" fill="#222">/api/invoices</text>
  <text x="630" y="483" text-anchor="middle" font-size="11" fill="#8a6d1f">900–1900ms</text>

  <rect x="480" y="535" width="300" height="50" rx="6" fill="#FFF3D6" stroke="#D9A441" stroke-width="1.5" />
