  <rect x="480" y="85"  width="300" height="50" rx="6" fill="#FFF3D6" stroke="#D9A441" stroke-width="1.5" />
  <text x="630" y="107" text-anchor="middle" font-size="13" fill="#222">/api/summary</text>
  <text x="630" y="123" text-anchor="middle" font-size="11" fill="#8a6d1f">800–1500ms</text>

  <rect x="480" y="175" width="300" height="50" rx="6" fill="#FFF3D6" stroke="#D9A441" stroke-width="1.5" />
  <text x="630" y="197" text-anchor="middle" font-size="13" fill="#222">/api/revenue</text>
  <text x="630" y="213" text-anchor="middle" font-size="11" fill="#8a6d1f">900–2000ms</text>

