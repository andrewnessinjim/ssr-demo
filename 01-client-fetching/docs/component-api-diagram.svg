  <line x1="300" y1="110" x2="480" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="102" text-anchor="middle" font-size="11" fill="#555">useSummary</text>

  <line x1="300" y1="200" x2="480" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="192" text-anchor="middle" font-size="11" fill="#555">useRevenue</text>

  <line x1="300" y1="290" x2="480" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="282" text-anchor="middle" font-size="11" fill="#555">useExpenses</text>

  <line x1="300" y1="380" x2="480" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="372" text-anchor="middle" font-size="11" fill="#555">useTransactions</text>

  <line x1="300" y1="470" x2="480" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="462" text-anchor="middle" font-size="11" fill="#555">useInvoices</text>

  <line x1="300" y1="560" x2="480" y2="560" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="552" text-anchor="middle" font-size="11" fill="#555">useCreditScore</text>

  <line x1="300" y1="650" x2="480" y2="650" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="642" text-anchor="middle" font-size="11" fill="#555">useCashFlowRatio</text>

  <line x1="300" y1="740" x2="480" y2="740" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="732" text-anchor="middle" font-size="11" fill="#555">useDebtRatio</text>

  <!-- ================= Lines: APIs -> right detail components ================= -->
  <line x1="780" y1="200" x2="920" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="192" text-anchor="middle" font-size="11" fill="#555">useRevenue</text>

  <line x1="780" y1="290" x2="920" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="282" text-anchor="middle" font-size="11" fill="#555">useExpenses</text>

  <line x1="780" y1="380" x2="920" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="372" text-anchor="middle" font-size="11" fill="#555">useTransactions</text>

  <line x1="780" y1="470" x2="920" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="462" text-anchor="middle" font-size="11" fill="#555">useInvoices</text>

  <!-- ================= Shared UI (no API, no lines) ================= -->
  <rect x="20" y="820" width="1140" height="90" rx="10" fill="#F3F3F3" stroke="#B7B7B7" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="35" y="845" font-size="13" font-weight="700" fill="#333">Shared UI components (no route, no API — see table below)</text>

  <rect x="35"  y="862" width="260" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" />
  <text x="165" y="885" text-anchor="middle" font-size="13" fill="#222">DashboardCard</text>

  <rect x="315" y="862" width="260" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" />
  <text x="445" y="885" text-anchor="middle" font-size="13" fill="#222">DetailPageHeader</text>

  <rect x="595" y="862" width="260" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" />
  <text x="725" y="885" text-anchor="middle" font-size="13" fill="#222">Spinner</text>

  <rect x="875" y="862" width="260" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" />
  <text x="1005" y="885" text-anchor="middle" font-size="13" fill="#222">ErrorNote</text>
</svg>
