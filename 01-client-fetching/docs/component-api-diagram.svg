  <rect x="40" y="175" width="260" height="50" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
  <text x="170" y="205" text-anchor="middle" font-size="14" fill="#222">RevenueChart</text>

  <rect x="40" y="265" width="260" height="50" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
