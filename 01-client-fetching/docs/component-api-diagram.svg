  <text x="170" y="385" text-anchor="middle" font-size="14" fill="#222">RecentTransactions</text>

  <rect x="40" y="445" width="260" height="50" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
  <text x="170" y="475" text-anchor="middle" font-size="14" fill="#222">OutstandingInvoices</text>

  <rect x="40" y="535" width="260" height="230" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
  <text x="170" y="565" text-anchor="middle" font-size="14" fill="#222">FinancialHealth</text>
  <text x="170" y="585" text-anchor="middle" font-size="11" fill="#666">(3 independent queries —</text>
  <text x="170" y="600" text-anchor="middle" font-size="11" fill="#666">the Suspense candidate)</text>

