  <rect x="900" y="165" width="260" height="70" rx="10" fill="#FFFDE7" stroke="#C9C36A" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="920" y="175" width="220" height="50" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
  <text x="1030" y="197" text-anchor="middle" font-size="13" fill="#222">RevenueChart</text>
