  <text x="1030" y="393" text-anchor="middle" font-size="10" fill="#666">variant="detail"</text>

  <text x="900" y="427" font-size="13" font-weight="700" fill="#333">/invoices</text>
  <rect x="900" y="435" width="260" height="70" rx="10" fill="#FFFDE7" stroke="#C9C36A" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="920" y="445" width="220" height="50" rx="6" fill="#ECECFF" stroke="#8C7AE6" stroke-width="1.5" />
  <text x="1030" y="467" text-anchor="middle" font-size="13" fill="#222">OutstandingInvoices</text>
  <text x="1030" y="483" text-anchor="middle" font-size="10" fill="#666">variant="detail"</text>

